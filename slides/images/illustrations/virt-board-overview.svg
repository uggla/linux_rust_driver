<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 235" role="img" aria-labelledby="title desc">
  <title id="title">Our ARM virt board and RGB peripheral</title>
  <desc id="desc">An ARM64 Cortex-A57 CPU, one GiB of RAM, a GIC interrupt controller and our RGB LED device share the system address space. The RGB MMIO window starts at 0x090d0000 and is 0x100 bytes long. The device signals an IRQ through the GIC to the CPU.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#29343b"/></marker></defs>
  <g font-family="Arial,Helvetica,sans-serif" fill="#29343b" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="8" width="924" height="219" rx="15" fill="#f5f6ef" stroke="#87968b" stroke-width="2"/>
    <text x="27" y="33" font-size="20" font-weight="bold">QEMU · virt</text>
    <path d="M790 70V46H520V70M480 70V46H130V70" fill="none" stroke="#29343b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M790 70V46H520V70" fill="none" stroke="#c05621" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="650" y="36" text-anchor="middle" font-size="19" fill="#c05621">IRQ</text>
    <text x="310" y="36" text-anchor="middle" font-size="19">interrupt</text>
    <rect x="42" y="70" width="177" height="78" rx="10" fill="#f1edf9" stroke="#805ad5" stroke-width="2.5"/>
    <text x="130" y="102" text-anchor="middle" font-size="26" font-weight="bold">ARM64 CPU</text>
    <text x="130" y="129" text-anchor="middle" font-size="20">Cortex-A57</text>
    <rect x="265" y="70" width="150" height="78" rx="10" fill="#e5eff8" stroke="#2b6cb0" stroke-width="2.5"/>
    <text x="340" y="102" text-anchor="middle" font-size="26" font-weight="bold">RAM</text>
    <text x="340" y="129" text-anchor="middle" font-size="20">1 GiB</text>
    <rect x="460" y="70" width="145" height="78" rx="10" fill="#faf0e6" stroke="#c05621" stroke-width="2.5"/>
    <text x="532" y="102" text-anchor="middle" font-size="26" font-weight="bold">GIC</text>
    <text x="532" y="129" text-anchor="middle" font-size="20">IRQ routing</text>
    <rect x="660" y="70" width="250" height="78" rx="10" fill="#f8e7d9" stroke="#c05621" stroke-width="3"/>
    <text x="779" y="102" text-anchor="middle" font-size="26" font-weight="bold" fill="#c05621">Our RGB device</text>
    <text x="785" y="129" text-anchor="middle" font-size="18">0x090d0000 · 0x100 bytes</text>
    <path d="M130 150V177H785V150M340 150V177M532 150V177" fill="none" stroke="#87968b" stroke-width="3"/>
    <text x="460" y="208" text-anchor="middle" font-size="21">System address space · RGB registers accessed through MMIO</text>
  </g>
</svg>
