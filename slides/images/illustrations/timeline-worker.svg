<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 285" role="img" aria-labelledby="title desc">
  <title id="title">Stage 05: Python returns while a worker continues</title>
  <desc id="desc">The ioctl returns early. A kernel worker performs the red, green, blue cycle, sleeping between writes. Hardware still receives a separate software write for each color.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#29343b"/></marker>
    <linearGradient id="fade"><stop stop-color="#ed3434"/><stop offset="1" stop-color="#111820"/></linearGradient>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" fill="#29343b" stroke-linecap="round" stroke-linejoin="round"><path d="M210 32L883 32" fill="none" stroke="#29343b" stroke-width="3" marker-end="url(#arrow)" /><text x="210" y="20" text-anchor="middle" fill="#29343b" font-size="18" font-weight="normal">0</text><text x="858" y="20" text-anchor="middle" fill="#29343b" font-size="18" font-weight="normal">~3 s</text><text x="185" y="94" text-anchor="end" fill="#2b6cb0" font-size="23" font-weight="bold">Python</text><path d="M210 88H858" stroke="#c5c6c2" stroke-width="2"/><text x="185" y="168" text-anchor="end" fill="#805ad5" font-size="23" font-weight="bold">Kernel worker</text><path d="M210 162H858" stroke="#c5c6c2" stroke-width="2"/><text x="185" y="242" text-anchor="end" fill="#c05621" font-size="23" font-weight="bold">LED</text><path d="M210 236H858" stroke="#c5c6c2" stroke-width="2"/><rect x="210" y="64" width="37" height="45" rx="7" fill="#e5eff8" stroke="#2b6cb0" stroke-width="3" /><text x="563" y="93" text-anchor="middle" fill="#2b6cb0" font-size="24" font-weight="normal">application continues</text><text x="252" y="58" text-anchor="start" fill="#29343b" font-size="17" font-weight="normal">returns early</text><rect x="210.0" y="140" width="15" height="40" rx="3" fill="#805ad5" stroke="#805ad5" stroke-width="3" /><rect x="210.0" y="214" width="216.0" height="44" rx="3" fill="#d94a4a" stroke="#d94a4a" stroke-width="3" /><text x="318.0" y="244" text-anchor="middle" fill="white" font-size="22" font-weight="bold">R</text><rect x="426.0" y="140" width="15" height="40" rx="3" fill="#805ad5" stroke="#805ad5" stroke-width="3" /><rect x="426.0" y="214" width="216.0" height="44" rx="3" fill="#32875e" stroke="#32875e" stroke-width="3" /><text x="534.0" y="244" text-anchor="middle" fill="white" font-size="22" font-weight="bold">G</text><rect x="642.0" y="140" width="15" height="40" rx="3" fill="#805ad5" stroke="#805ad5" stroke-width="3" /><rect x="642.0" y="214" width="216.0" height="44" rx="3" fill="#397dbb" stroke="#397dbb" stroke-width="3" /><text x="750.0" y="244" text-anchor="middle" fill="white" font-size="22" font-weight="bold">B</text><text x="328.8" y="195" text-anchor="middle" fill="#805ad5" font-size="18">sleep</text><text x="254" y="134" text-anchor="middle" fill="#805ad5" font-size="17">write R</text><text x="544.8" y="195" text-anchor="middle" fill="#805ad5" font-size="18">sleep</text><text x="470" y="134" text-anchor="middle" fill="#805ad5" font-size="17">write G</text><text x="760.8" y="195" text-anchor="middle" fill="#805ad5" font-size="18">sleep</text><text x="686" y="134" text-anchor="middle" fill="#805ad5" font-size="17">write B</text></g>
