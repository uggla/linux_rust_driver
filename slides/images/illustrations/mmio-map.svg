<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">Map a device physical address into kernel virtual memory</title>
  <desc id="desc">The kernel obtains an MMIO mapping with ioremap; this mapping gives access to registers in the physical device address range, rather than treating a physical number as an ordinary pointer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#29343b"/></marker>
    <linearGradient id="fade"><stop stop-color="#ed3434"/><stop offset="1" stop-color="#111820"/></linearGradient>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" fill="#29343b" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="38" width="300" height="214" rx="15" fill="#f1edf9" stroke="#805ad5" stroke-width="3" /><text x="170" y="77" text-anchor="middle" fill="#805ad5" font-size="25" font-weight="bold">Kernel address space</text><rect x="54" y="108" width="231" height="104" rx="8" fill="#fffef9" stroke="#805ad5" stroke-width="3" /><text x="169" y="145" text-anchor="middle" fill="#29343b" font-size="24" font-weight="normal">MMIO mapping</text><text x="169" y="181" text-anchor="middle" fill="#29343b" font-size="21" font-weight="normal">base + offset</text><path d="M344 146L551 146" fill="none" stroke="#29343b" stroke-width="3" marker-end="url(#arrow)" /><text x="447" y="119" text-anchor="middle" fill="#29343b" font-size="23" font-weight="bold">ioremap</text><rect x="579" y="38" width="319" height="214" rx="15" fill="#faf0e6" stroke="#c05621" stroke-width="3" /><text x="738" y="77" text-anchor="middle" fill="#c05621" font-size="25" font-weight="bold">Device physical space</text><text x="606" y="116" text-anchor="start" fill="#29343b" font-size="20" font-weight="normal">0x090d0000  RED</text><text x="606" y="149" text-anchor="start" fill="#29343b" font-size="20" font-weight="normal">0x090d0004  GREEN</text><text x="606" y="182" text-anchor="start" fill="#29343b" font-size="20" font-weight="normal">0x090d0008  BLUE</text><text x="606" y="215" text-anchor="start" fill="#29343b" font-size="20" font-weight="normal">0x090d000c  APPLY</text></g>
</svg>
