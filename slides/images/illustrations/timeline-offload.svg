<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 285" role="img" aria-labelledby="title desc">
  <title id="title">Stage 06: hardware fades and a completion IRQ wakes Python</title>
  <desc id="desc">START programs the hardware once. Python sleeps in WAIT while the device autonomously fades from red to black. At completion an IRQ runs the driver handler, which wakes the waiting caller. A default three-second fade is illustrated.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#29343b"/></marker>
    <linearGradient id="fade"><stop stop-color="#ed3434"/><stop offset="1" stop-color="#111820"/></linearGradient>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" fill="#29343b" stroke-linecap="round" stroke-linejoin="round"><path d="M210 32L883 32" fill="none" stroke="#29343b" stroke-width="3" marker-end="url(#arrow)" /><text x="210" y="20" text-anchor="middle" fill="#29343b" font-size="18" font-weight="normal">0</text><text x="858" y="20" text-anchor="middle" fill="#29343b" font-size="18" font-weight="normal">~3 s</text><text x="185" y="94" text-anchor="end" fill="#2b6cb0" font-size="23" font-weight="bold">Python</text><path d="M210 88H858" stroke="#c5c6c2" stroke-width="2"/><text x="185" y="168" text-anchor="end" fill="#805ad5" font-size="23" font-weight="bold">Driver</text><path d="M210 162H858" stroke="#c5c6c2" stroke-width="2"/><text x="185" y="242" text-anchor="end" fill="#c05621" font-size="23" font-weight="bold">Hardware</text><path d="M210 236H858" stroke="#c5c6c2" stroke-width="2"/><rect x="210" y="64" width="35" height="45" rx="5" fill="#e5eff8" stroke="#2b6cb0" stroke-width="3" /><rect x="256" y="64" width="602" height="45" rx="9" fill="#e5eff8" stroke="#2b6cb0" stroke-width="3" /><text x="227" y="56" text-anchor="middle" fill="#29343b" font-size="17" font-weight="normal">START</text><text x="552" y="93" text-anchor="middle" fill="#2b6cb0" font-size="24" font-weight="normal">WAIT · sleeping</text><rect x="210" y="140" width="19" height="40" rx="3" fill="#805ad5" stroke="#805ad5" stroke-width="3" /><rect x="839" y="140" width="19" height="40" rx="3" fill="#805ad5" stroke="#805ad5" stroke-width="3" /><text x="240" y="193" text-anchor="start" fill="#805ad5" font-size="18" font-weight="normal">program once</text><text x="818" y="193" text-anchor="middle" fill="#805ad5" font-size="18" font-weight="normal">handle IRQ</text><rect x="210" y="214" width="648" height="44" rx="7" fill="url(#fade)" stroke="#c05621" stroke-width="3" /><text x="535" y="244" text-anchor="middle" fill="white" font-size="23" font-weight="bold">autonomous fade</text><path d="M858 213L858 183" fill="none" stroke="#29343b" stroke-width="3" marker-end="url(#arrow)" /><path d="M858 139L858 114" fill="none" stroke="#29343b" stroke-width="3" marker-end="url(#arrow)" /><text x="876" y="170" text-anchor="start" fill="#c05621" font-size="17" font-weight="normal">IRQ</text></g>
</svg>
