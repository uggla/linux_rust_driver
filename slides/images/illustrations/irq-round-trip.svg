<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">IRQ completion and device acknowledgement</title>
  <desc id="desc">The device raises its IRQ line. The ARM GIC routes it to Linux. Our threaded IRQ handler acknowledges the device source and makes Python runnable. Clearing the source is distinct from the GIC bookkeeping.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#29343b"/></marker>
    <linearGradient id="fade"><stop stop-color="#ed3434"/><stop offset="1" stop-color="#111820"/></linearGradient>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" fill="#29343b" stroke-linecap="round" stroke-linejoin="round"><rect x="22" y="43" width="180" height="142" rx="14" fill="#fbfaf3" stroke="#c05621" stroke-width="3" /><text x="112" y="170" text-anchor="middle" fill="#c05621" font-size="24" font-weight="bold">Device</text><rect x="252" y="43" width="180" height="142" rx="14" fill="#fbfaf3" stroke="#c05621" stroke-width="3" /><text x="342" y="170" text-anchor="middle" fill="#c05621" font-size="24" font-weight="bold">GIC</text><rect x="482" y="43" width="180" height="142" rx="14" fill="#fbfaf3" stroke="#805ad5" stroke-width="3" /><text x="572" y="170" text-anchor="middle" fill="#805ad5" font-size="24" font-weight="bold">IRQ thread</text><rect x="712" y="43" width="180" height="142" rx="14" fill="#fbfaf3" stroke="#2b6cb0" stroke-width="3" /><text x="802" y="170" text-anchor="middle" fill="#2b6cb0" font-size="24" font-weight="bold">Python</text><g transform="translate(112 88) scale(0.7)">
      <path d="M-12 27V61M12 27V53" stroke="#78848c" stroke-width="5"/>
      <path d="M-25 24V-6A25 25 0 0 1 25-6V24Z" fill="#172028" stroke="#29343b" stroke-width="3"/>
      <path d="M-12-6Q-12-18 0-18" stroke="#ffffffb0" stroke-width="6" fill="none"/>
      <rect x="-30" y="23" width="60" height="9" rx="3" fill="#172028" stroke="#29343b" stroke-width="3"/>
    </g><path d="M324.0 55V65M324.0 125V135M302 77.0H312M372 77.0H382" stroke="#c05621" stroke-width="5"/><path d="M336.0 55V65M336.0 125V135M302 89.0H312M372 89.0H382" stroke="#c05621" stroke-width="5"/><path d="M348.0 55V65M348.0 125V135M302 101.0H312M372 101.0H382" stroke="#c05621" stroke-width="5"/><path d="M360.0 55V65M360.0 125V135M302 113.0H312M372 113.0H382" stroke="#c05621" stroke-width="5"/><rect x="312" y="65" width="60" height="60" rx="10" fill="#fbfaf3" stroke="#c05621" stroke-width="3" /><rect x="319.8" y="72.8" width="44.4" height="44.4" rx="7" fill="#c05621" stroke="#c05621" stroke-width="3" /><text x="342.0" y="100.4" text-anchor="middle" fill="white" font-size="14.399999999999999" font-weight="bold">GIC</text><path d="M554.0 55V65M554.0 125V135M532 77.0H542M602 77.0H612" stroke="#805ad5" stroke-width="5"/><path d="M566.0 55V65M566.0 125V135M532 89.0H542M602 89.0H612" stroke="#805ad5" stroke-width="5"/><path d="M578.0 55V65M578.0 125V135M532 101.0H542M602 101.0H612" stroke="#805ad5" stroke-width="5"/><path d="M590.0 55V65M590.0 125V135M532 113.0H542M602 113.0H612" stroke="#805ad5" stroke-width="5"/><rect x="542" y="65" width="60" height="60" rx="10" fill="#fbfaf3" stroke="#805ad5" stroke-width="3" /><rect x="549.8" y="72.8" width="44.4" height="44.4" rx="7" fill="#805ad5" stroke="#805ad5" stroke-width="3" /><text x="572.0" y="100.4" text-anchor="middle" fill="white" font-size="14.399999999999999" font-weight="bold">IRQ</text><rect x="747" y="66" width="110" height="58" rx="6" fill="#e5eff8" stroke="#2b6cb0" stroke-width="3" /><text x="802" y="106" text-anchor="middle" fill="#2b6cb0" font-size="29" font-weight="bold">&gt; _</text><path d="M206 110L248 110" fill="none" stroke="#29343b" stroke-width="3" marker-end="url(#arrow)" /><text x="227.0" y="88" text-anchor="middle" fill="#29343b" font-size="16" font-weight="normal">raise</text><path d="M436 110L478 110" fill="none" stroke="#29343b" stroke-width="3" marker-end="url(#arrow)" /><text x="457.0" y="88" text-anchor="middle" fill="#29343b" font-size="16" font-weight="normal">route</text><path d="M666 110L708 110" fill="none" stroke="#29343b" stroke-width="3" marker-end="url(#arrow)" /><text x="687.0" y="88" text-anchor="middle" fill="#29343b" font-size="16" font-weight="normal">wake</text><path d="M572 190V245H112V190" stroke="#29343b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="342" y="275" text-anchor="middle" fill="#29343b" font-size="21" font-weight="normal">acknowledge the device source</text></g>
</svg>
